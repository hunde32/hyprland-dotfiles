# Source the Matugen generated colors
source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    path = ~/.cache/current_wallpaper
    
    # Increased blur for a frosted glass look to make the text pop
    blur_passes = 3
    blur_size = 5
    noise = 0.0117
    contrast = 1.1000
    brightness = 0.7000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# 1. HUGE, MINIMALIST CLOCK
label {
    monitor =
    # Grabs the current time in HH:MM format
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    
    # Using your dynamic Matugen primary color
    color = $primary
    
    # Custom font selection (Change to your chosen font)
    font_family = Clash Display SemiBold
    font_size = 140
    
    position = 0, 140
    halign = center
    valign = center
    
    # Adds a subtle drop shadow for depth
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# 2. SLEEK DATE DISPLAY
label {
    monitor =
    # Grabs the date (e.g., "Thursday, Aug 13")
    text = cmd[update:18000000] echo "<b>$(date +"%A, %b %d")</b>"
    
    # Using the secondary/text color from Matugen
    color = $on_background
    
    # A contrasting, clean font for secondary information
    font_family = Space Grotesk
    font_size = 22
    
    position = 0, 20
    halign = center
    valign = center
}

# 3. STEALTHY INPUT FIELD
input-field {
    monitor =
    size = 220, 45
    
    # Ultra-thin outline
    outline_thickness = 2
    
    dots_size = 0.2
    dots_spacing = 0.25
    dots_center = true
    
    # Colors: Transparent dark inner capsule, colored border
    outer_color = $primary
    inner_color = rgba(0, 0, 0, 0.2) 
    font_color = $on_background
    check_color = $primary
    fail_color = rgb(ff6666) 
    
    fade_on_empty = true
    # Minimalist placeholder prompt
    placeholder_text = <i>...</i> 
    hide_input = false
    
    position = 0, -80
    halign = center
    valign = center
}
