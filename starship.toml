# --- GLOBAL CONFIG ---
add_newline = true
palette = "matugen"

# Added spaces between modules so the pills don't stick together
format = """
$username$hostname $directory $git_branch $cmd_duration
 $character"""

[fill]
symbol = '-'
style = 'fg:outline'

[character]                            
success_symbol = "[ ](bold fg:primary)"
error_symbol = "[ ](bold fg:error)"

[package]
disabled = true

[git_branch]
style = "bg:secondary"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = "[](bold fg:secondary)[$symbol $branch(:$remote_branch)](fg:on_secondary bg:secondary)[](bold fg:secondary)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format = "[•$hostname](bg:tertiary bold fg:on_tertiary)[](bold fg:tertiary)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[username]
style_user = "bold bg:tertiary fg:on_tertiary"
style_root = "red bold"
format = "[](bold fg:tertiary)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:primary fg:on_primary"
truncation_length = 2
truncation_symbol = ".../"
format = "[](bold fg:primary)[󰉋 → $path]($style)[](bold fg:primary)"

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = "[](bold fg:surface_variant)[󰪢 $duration](bold bg:surface_variant fg:on_surface_variant)[](bold fg:surface_variant)"


# --- THE MATUGEN SAUCE ---
# In TOML, this must be at the very bottom so it doesn't absorb other variables!
[palettes.matugen]
primary = "#f0bf6d"
on_primary = "#432c00"
secondary = "#dbc3a1"
on_secondary = "#3d2e16"
tertiary = "#b5cea4"
on_tertiary = "#213618"
surface_variant = "#4e4539"
on_surface_variant = "#d2c4b4"
error = "#ffb4ab"
outline = "#9b8f80"
